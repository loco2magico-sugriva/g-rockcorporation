<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Rock Simulation Engine v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #04060a;
            --bg-panel: rgba(17, 24, 39, 0.85);
            --border-glow: #1f2a3a;
            --cyber-blue: #4aa3ff;
            --neon-green: #3dff9c;
            --neon-yellow: #ffd24a;
            --neon-red: #ff5c5c;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: #e6e6e6;
            overflow: hidden;
        }
        header {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0f18;
            border-bottom: 1px solid var(--border-glow);
        }
        header b {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            color: var(--cyber-blue);
        }
        nav button {
            background: #111827;
            border: 1px solid var(--border-glow);
            color: #8a99ad;
            font-family: 'Share Tech Mono', monospace;
            padding: 8px 16px;
            margin-left: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        nav button:hover, nav button.active-nav {
            color: var(--cyber-blue);
            border-color: var(--cyber-blue);
            box-shadow: 0 0 10px rgba(74,163,255,0.2);
        }
        .view {
            display: none;
            height: calc(100vh - 65px);
            padding: 25px;
            box-sizing: border-box;
        }
        .active { display: block; }
        
        /* THEATER MAP OVERLAY */
        .map-canvas {
            position: relative;
            height: 100%;
            background: radial-gradient(circle at center, #0f1626 0%, #04060a 100%);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }
        .node {
            position: absolute;
            width: 200px;
            padding: 15px;
            background: rgba(11, 15, 24, 0.9);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .node:hover {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 20px rgba(74, 163, 255, 0.4);
            transform: translateY(-3px);
        }
        
        /* DATA GRID INTERFACE */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            padding: 25px;
            border-radius: 8px;
        }
        .panel h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyber-blue);
            margin-top: 0;
            letter-spacing: 1px;
        }
        .telemetry-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 15px;
            color: #8a99ad;
        }
        .badge {
            font-family: 'Share Tech Mono', monospace;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .STABLE { background: #0f3d2e; color: var(--neon-green); }
        .VOLATILE { background: #3d3410; color: var(--neon-yellow); }
        .UNSTABLE { background: #3d1010; color: var(--neon-red); }
        .OVERACTIVE { background: #102a3d; color: #4af5ff; }

        button.action {
            margin-top: 15px;
            padding: 10px 20px;
            background: #111827;
            border: 1px solid var(--cyber-blue);
            color: var(--cyber-blue);
            font-family: 'Share Tech Mono', monospace;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.action:hover {
            background: var(--cyber-blue);
            color: #000000;
            box-shadow: 0 0 15px rgba(74, 163, 255, 0.4);
        }
        .integrity-readout {
            font-family: 'Share Tech Mono', monospace;
            font-size: 36px;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(61,255,156,0.3);
        }
    </style>
</head>
<body>

<header>
    <b>G-ROCK ENGINE // SIM STATE MATRIX</b>
    <nav>
        <button id="btn-map" class="active-nav" onclick="show('map')">THEATER MAP</button>
        <button id="btn-core" onclick="show('core')">CORE TELEMETRY</button>
        <button onclick="resetWorld()" style="border-color: var(--neon-red); color: var(--neon-red);">RESET ARCHITECTURE</button>
    </nav>
</header>

<!-- THEATER MAP -->
<div id="map" class="view active">
    <div class="map-canvas">
        <div class="node" style="top: 25%; left: 15%;" onclick="selectNode('University')">Academic Node</div>
        <div class="node" style="top: 60%; left: 20%;" onclick="selectNode('Bank')">Financial Node</div>
        <div class="node" style="top: 40%; left: 50%;" onclick="selectNode('Parliament')">Governance Node</div>
        <div class="node" style="top: 70%; left: 75%;" onclick="selectNode('Ceuta')">Ceuta Hub Node</div>
    </div>
</div>

<!-- CORE TELEMETRY -->
<div id="core" class="view">
    <div class="grid">
        <div class="panel">
            <h3>Financial Network</h3>
            <span class="telemetry-label">Status Matrix:</span> 
            <span id="eco" class="badge STABLE">STABLE</span>
            <br>
            <button class="action" onclick="triggerShock()">Execute Market Shock</button>
        </div>

        <div class="panel">
            <h3>Governance Protocols</h3>
            <span class="telemetry-label">Stability Vector:</span> 
            <span id="gov" class="badge STABLE">STABLE</span>
            <br>
            <button class="action" onclick="triggerCrisis()">Deploy System Crisis Protocol</button>
        </div>

        <div class="panel">
            <h3>Academic Network</h3>
            <span class="telemetry-label">Output Performance:</span> 
            <span id="uni" class="badge STABLE">STABLE</span>
            <br>
            <button class="action" onclick="triggerBoost()">Inject Research Stimulus</button>
        </div>

        <div class="panel">
            <h3>System Health Index</h3>
            <div class="telemetry-label">Global Matrix Integrity:</div>
            <div id="coreVal" class="integrity-readout">100%</div>
        </div>
    </div>
</div>

<script>
let state = { eco: "STABLE", gov: "STABLE", uni: "STABLE", core: 100 };

function loadSave() {
    let saved = localStorage.getItem("grock_state_v2");
    if(saved) state = JSON.parse(saved);
}

function saveState() {
    localStorage.setItem("grock_state_v2", JSON.stringify(state));
}

function updateUI() {
    const ecoEl = document.getElementById("eco");
    const govEl = document.getElementById("gov");
    const uniEl = document.getElementById("uni");
    const coreEl = document.getElementById("coreVal");

    ecoEl.innerText = state.eco;
    ecoEl.className = "badge " + state.eco;

    govEl.innerText = state.gov;
    govEl.className = "badge " + state.gov;

    uniEl.innerText = state.uni;
    uniEl.className = "badge " + state.uni;

    coreEl.innerText = state.core + "%";
    
    if (state.core > 75) coreEl.style.color = "var(--neon-green)";
    else if (state.core > 45) coreEl.style.color = "var(--neon-yellow)";
    else coreEl.style.color = "var(--neon-red)";

    saveState();
}

function show(viewId) {
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('active-nav'));
    
    document.getElementById(viewId).classList.add('active');
    document.getElementById('btn-' + viewId).classList.add('active-nav');
}

function triggerShock() {
    state.eco = "VOLATILE";
    state.core = Math.max(0, state.core - 10);
    updateUI();
}

function triggerCrisis() {
    state.gov = "UNSTABLE";
    state.core = Math.max(0, state.core - 15);
    updateUI();
}

function triggerBoost() {
    state.uni = "OVERACTIVE";
    state.core = Math.min(100, state.core + 5);
    updateUI();
}

function selectNode(name) {
    console.log(`[CORE INTERFACE] Route mapped to: ${name}`);
}

function resetWorld() {
    localStorage.removeItem("grock_state_v2");
    state = { eco: "STABLE", gov: "STABLE", uni: "STABLE", core: 100 };
    updateUI();
}

// Initial System Sequence
loadSave();
updateUI();
</script>

</body>
</html>
