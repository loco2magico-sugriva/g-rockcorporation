<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Upload System</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#05070d;
color:#e6e6e6;
}

header{
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header b{
color:#4aa3ff;
letter-spacing:2px;
}

header a{
color:#aaa;
text-decoration:none;
font-size:12px;
}

header a:hover{color:#4aa3ff;}

.container{
max-width:800px;
margin:30px auto;
padding:20px;
}

.uploadBox{
background:#111827;
border:1px solid #1f2a3a;
padding:20px;
border-radius:12px;
text-align:center;
}

input,button{
margin-top:10px;
padding:10px;
border-radius:8px;
border:1px solid #1f2a3a;
background:#0b0f18;
color:white;
}

button{
cursor:pointer;
}

button:hover{
border-color:#4aa3ff;
}

.gallery{
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.media{
width:100%;
border-radius:8px;
border:1px solid #1f2a3a;
}
</style>
</head>

<body>

<header>
<b>GLOBAL UPLOAD SYSTEM</b>
<a href="index.html">Dashboard</a>
</header>

<div class="container">

<div class="uploadBox">
<h3>Upload Image / Video</h3>

<input type="file" id="fileInput" accept="image/*,video/*">
<br>
<button onclick="uploadFile()">Upload</button>
</div>

<div class="gallery" id="gallery"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL, listAll } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const folderRef = ref(storage, "uploads");

window.uploadFile = async function(){
const file = document.getElementById("fileInput").files[0];
if(!file) return alert("No file selected");

const fileRef = ref(storage, "uploads/" + Date.now() + "_" + file.name);
await uploadBytes(fileRef, file);
const url = await getDownloadURL(fileRef);

addToGallery(url, file.type);
}

async function loadFiles(){
const res = await listAll(folderRef);
res.items.forEach(async (item)=>{
const url = await getDownloadURL(item);
addToGallery(url, "image"); // Domyślnie traktowane jako obraz, Firebase Storage wykryje typ przy bezpośrednim uploadzie
});
}

function addToGallery(url, type){
let el;
if(type.startsWith("video")){
el = document.createElement("video");
el.controls = true;
el.src = url;
} else {
el = document.createElement("img");
el.src = url;
}
el.className = "media";
document.getElementById("gallery").appendChild(el);
}

loadFiles();
</script>

</body>
</html>
